[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polyquant"
version = "2.0.0"
description = "Autonomous Arbitrage Extraction via Multi-Agent Logical Reasoning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "PolyQuant Team"}
]
keywords = ["polymarket", "arbitrage", "trading", "ai", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.1.0",
    
    # AI/LLM
    "google-generativeai>=0.8.0",
    "langchain>=0.1.0",
    "langchain-google-genai>=2.0.0",
    "openai>=1.0.0",
    "sentence-transformers>=2.2.0",
    
    # HTTP & WebSockets
    "httpx>=0.26.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    
    # Polymarket & Web3
    "py-clob-client>=0.17.0",
    "eth-account>=0.11.0",
    "web3>=6.0.0",
    "requests>=2.30.0",
    
    # Optimization
    "pyscipopt>=4.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    
    # Data & Caching
    "redis>=5.0.0",
    "pandas>=2.2.0",
    "orjson>=3.9.0",
    "aiofiles>=23.0.0",
    
    # Logging & Monitoring
    "structlog>=24.1.0",
    "prometheus-client>=0.19.0",
    
    # API Server
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    
    # IPC & Messaging
    "pyzmq>=26.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.8.0",
    "ruff>=0.2.0",
    "black>=24.1.0",
]

[project.scripts]
polyquant = "polyquant.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
