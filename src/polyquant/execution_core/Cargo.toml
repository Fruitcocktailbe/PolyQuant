[package]
name = "execution_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "execution_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
alloy-sol-types = "0.7"
alloy-primitives = { version = "0.7", features = ["serde"] }
alloy-signer = "0.1"
alloy-signer-local = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
