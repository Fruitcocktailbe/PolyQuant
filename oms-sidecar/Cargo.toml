[package]
name = "oms-sidecar"
version = "0.3.0"
edition = "2021"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
zeromq = "0.4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
reqwest = { version = "0.12", features = ["json"] }
alloy = { version = "0.7.1", features = ["full"] }
dotenvy = "0.15"
anyhow = "1.0"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rust_decimal = "1.36"
